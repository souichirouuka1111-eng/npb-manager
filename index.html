<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPB MANAGER テスト</title>

<style>
body {
    font-family: sans-serif;
    margin: 0;
    padding: 20px;
    background: #f3f4f6;
}

button {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    font-size: 18px;
    border-radius: 10px;
    border: 1px solid #ccc;
    background: white;
}

#game {
    display: none;
}

#next {
    background: #14213d;
    color: white;
}

#reset {
    background: #ffe5e5;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<div id="select" class="card">

<h1>⚾ NPB MANAGER</h1>

<h2>球団を選択</h2>

<button onclick="chooseTeam('阪神タイガース')">
阪神タイガース
</button>

<button onclick="chooseTeam('読売ジャイアンツ')">
読売ジャイアンツ
</button>

<button onclick="chooseTeam('横浜DeNAベイスターズ')">
横浜DeNAベイスターズ
</button>

<button onclick="chooseTeam('広島東洋カープ')">
広島東洋カープ
</button>

<button onclick="chooseTeam('中日ドラゴンズ')">
中日ドラゴンズ
</button>

<button onclick="chooseTeam('東京ヤクルトスワローズ')">
東京ヤクルトスワローズ
</button>

</div>


<div id="game">

<div class="card">

<h1>⚾ NPB MANAGER</h1>

<p>
監督球団：
<strong id="team"></strong>
</p>

<h2 id="date"></h2>

<button id="next" onclick="nextDay()">
▶ 次の日へ
</button>

<button id="reset" onclick="resetGame()">
ゲームをリセット
</button>

</div>

</div>


<script>

let team = null;

let date = new Date(2027, 2, 25);


function chooseTeam(name) {

    team = name;

    date = new Date(2027, 2, 25);

    document.getElementById("team").textContent = team;

    updateDate();

    document.getElementById("select").style.display = "none";

    document.getElementById("game").style.display = "block";

}


function updateDate() {

    document.getElementById("date").textContent =
        date.getFullYear() +
        "年" +
        (date.getMonth() + 1) +
        "月" +
        date.getDate() +
        "日";

}


function nextDay() {

    date.setDate(date.getDate() + 1);

    updateDate();

}


function resetGame() {

    team = null;

    date = new Date(2027, 2, 25);

    document.getElementById("game").style.display = "none";

    document.getElementById("select").style.display = "block";

}


</script>

</body>
</html>
